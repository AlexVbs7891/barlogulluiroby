<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Barlogul lui Roby</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dark-theme">
    <div class="loader-wrapper"><div class="loader-glitch" data-text="LOADING...">LOADING...</div></div>
    <div class="custom-cursor"></div><div class="mouse-glow"></div><div id="particles-js"></div>

    <nav class="navbar glassmorphism sticky">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon"><i class="fa-solid fa-gamepad"></i></span>
                <span class="logo-text neon-text">BARLOGUL <span class="purple-accent">LUI ROBY</span></span>
            </a>
            <div class="nav-links">
                <a href="index.html">Acasă</a>
                <a href="shop.html">Magazin</a>
                <a href="contact.html" class="active">Contact</a>
                <a href="faq.html">FAQ</a>
            </div>
            <div class="hamburger"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <main class="contact-container container">
        <div class="contact-card glass-panel rgb-border-static" data-aos="zoom-in">
            <h1 class="neon-text">CONTACT & PLĂȚI</h1>
            <p>Toate tranzacțiile și asistența se desfășoară exclusiv pe serverul nostru de Discord pentru securitate maximă.</p>
            
            <a href="https://discord.gg/yourinvite" target="_blank" class="btn btn-discord 3d-hover">
                <i class="fa-brands fa-discord"></i> Intră pe Discord
            </a>

            <div class="payment-methods">
                <h3 class="purple-accent">Metode de Plată Acceptate</h3>
                <div class="payment-grid">
                    <div class="pay-method 3d-hover"><i class="fa-brands fa-cc-paypal"></i> PayPal</div>
                    <div class="pay-method 3d-hover"><i class="fa-solid fa-building-columns"></i> Transfer Bancar</div>
                    <div class="pay-method 3d-hover">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12.923 15.65h5.405l-1.95-6.852-5.407.013 1.952 6.839zm-3.23-6.839l-1.942-6.811H2.348l4.437 15.545h5.405l-1.503-5.275 1.558-5.467-2.552.008zM19.16 3l-1.63 5.719h-5.406l1.63-5.719h5.406z"/></svg>
                        Revolut
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/script.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
